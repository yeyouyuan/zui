services:
  documentserver:
    image: onlyoffice/documentserver:10.0@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    restart: unless-stopped
    ports:
      - '127.0.0.1:8082:80'
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${JWT_SECRET:?Run node scripts/office-runtime.mjs start to initialize the secret}
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      GENERATE_FONTS: 'true'
    volumes:
      - documentserver_data:/var/www/onlyoffice/Data
      - documentserver_logs:/var/log/onlyoffice
      - documentserver_lib:/var/lib/onlyoffice
      - documentserver_db:/var/lib/postgresql
      - ./fonts.local:/var/www/onlyoffice/Data/custom-fonts/zui:ro
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--max-time', '3', 'http://localhost/healthcheck']
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    stop_grace_period: 60s

  bridge:
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    working_dir: /app
    command: ['node', 'server.mjs']
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:8790:8790'
    environment:
      HOST: '0.0.0.0'
      PORT: '8790'
      JWT_SECRET: ${JWT_SECRET:?Run node scripts/office-runtime.mjs start to initialize the secret}
      DOCSERVER_INTERNAL_URL: http://documentserver
      DOCSERVER_PUBLIC_URL: http://127.0.0.1:8082
      BRIDGE_INTERNAL_URL: http://bridge:8790
      OFFICE_DATA_DIR: /data
    volumes:
      - ../../services/office-bridge:/app:ro
      - bridge_data:/data
    depends_on:
      documentserver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8790/api/office/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    stop_grace_period: 30s

volumes:
  documentserver_data:
  documentserver_logs:
  documentserver_lib:
  documentserver_db:
  bridge_data:
