name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node registry/scripts/generate.mjs --check
      - run: pnpm -r build
      - run: pnpm --filter @zui/react build:browser
      - run: pnpm -r typecheck
      - run: pnpm lint
      # a11y: axe-core 扫描已包含在 packages/ui 测试套件（src/test/a11y.axe.test.tsx）
      - run: pnpm -r test
      - run: pnpm test:e2e --workers=1
      - name: Validate published ESM and CommonJS entries
        run: node scripts/check-distribution.mjs
      - name: Compile installed sources and MCP examples
        run: node scripts/check-consumer.mjs
      - name: Check complete entry bundle budget (JS gzip < 112 KiB)
        run: node scripts/check-bundle-size.mjs
